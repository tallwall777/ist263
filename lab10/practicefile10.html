<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 10 Practice</title>
    <script>
        function Winnermessage () {
            document.getElementById("messages").innerHTML = 'You Won!';
        }
        function TryAgain () {
            document.getElementById("messages").innerHTML = 'Wrong Shell-Try Again';
        }
        function ShuffleShells() {
            document.getElementById("first").style.order = Math.floor(Math.random() * 3) + 2;
        }
    
    </script>
    <style>
        .container {
            display: flex;
        }
        #first {order: 1;}
        #second {order: 2;}
        #third {order: 3;}
    </style>
    <link rel="stylesheet" href="https://laferger.github.io/ist263/images/animate.css">
</head>
<body onload="ShuffleShells();">
    <h1>Choose a Walnut</h1>
    <div id="messages"></div>
    <div class="container">
    <img src="https://laferger.github.io/ist263/images/walnut.png" id="first" alt="first walnut" onclick="Winnermessage()" class="first"> 

    <img src="https://laferger.github.io/ist263/images/walnut.png" id="second" alt="second walnut" onclick="TryAgain()" class="second">

    <img src="https://laferger.github.io/ist263/images/walnut.png" id="third" alt="third walnut" onclick="TryAgain()" class="third">
</div>
</body>
</html>
