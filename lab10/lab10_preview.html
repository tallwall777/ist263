<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 10 Practice</title>
    <script>
        function Winnermessage () {
            document.getElementById("messages").innerHTML = 'You Won!';
        }
        function TryAgain () {
            document.getElementById("messages").innerHTML = 'Wrong Shell-Try Again';
        }
    
    </script>
    <link rel="stylesheet" href="https://laferger.github.io/ist263/images/animate2.css">
</head>
<body>
    <h1>Choose a Walnut</h1>
    <img src="https://laferger.github.io/ist263/images/walnut.png" alt="first walnut" onclick="Winnermessage()" class="first"> 

    <img src="https://laferger.github.io/ist263/images/walnut.png" alt="second walnut" onclick="TryAgain()" class="second">

    <img src="https://laferger.github.io/ist263/images/walnut.png" alt="third walnut" onclick="TryAgain()" class="third">

    <div id="messages"></div>
</body>
</html>
